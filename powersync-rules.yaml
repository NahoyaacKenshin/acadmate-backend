# PowerSync Sync Rules for AcadMate
# This file defines how data is synchronized to offline clients.

bucket_definitions:
  user_data:
    # This bucket will contain data specific to the authenticated user.
    # 'request.jwt.sub' contains the 'sub' claim from the token generated by /api/auth/powersync-token
    data:
      - SELECT * FROM subjects WHERE "userId" = request.jwt.sub
      - SELECT * FROM tasks WHERE "userId" = request.jwt.sub
