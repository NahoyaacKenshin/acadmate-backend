config:
  edition: 3

streams:
  user_subjects:
    auto_subscribe: true
    query: >
      SELECT id, name, color, "createdAt", "updatedAt", "userId" 
      FROM "Subject" 
      WHERE "userId" = auth.user_id()

  user_tasks:
    auto_subscribe: true
    query: >
      SELECT id, title, description, "dueDate", completed, "createdAt", "updatedAt", "userId", "subjectId" 
      FROM "Task" 
      WHERE "userId" = auth.user_id()

  user_class_schedules:
    auto_subscribe: true
    query: >
      SELECT id, "dayOfWeek", "startTime", "endTime", room, modality, "setType", "startDate", "endDate", "createdAt", "updatedAt", "userId", "subjectId" 
      FROM "ClassSchedule" 
      WHERE "userId" = auth.user_id()

  user_calendar_events:
    auto_subscribe: true
    query: >
      SELECT id, title, description, "startDate", "endDate", "allDay", location, color, "createdAt", "updatedAt", "userId", "subjectId" 
      FROM "CalendarEvent" 
      WHERE "userId" = auth.user_id()

  user_exam_weeks:
    auto_subscribe: true
    query: >
      SELECT id, title, "startDate", "endDate", "createdAt", "updatedAt", "userId" 
      FROM "ExamWeek" 
      WHERE "userId" = auth.user_id()

  # Global admin-managed tables — synced to ALL authenticated users (no user_id filter)
  global_semester_rules:
    auto_subscribe: true
    query: >
      SELECT id, date, "ruleType", label, "createdAt", "updatedAt"
      FROM "SemesterRule"

  global_program_mappings:
    auto_subscribe: true
    query: >
      SELECT id, "programName", "studentSet", "createdAt", "updatedAt"
      FROM "ProgramMapping"
