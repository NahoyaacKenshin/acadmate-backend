services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acadmate-api
    restart: unless-stopped
    ports:
      # Bind to 127.0.0.1:8000 so the API is only exposed to the reverse proxy (Caddy/Nginx)
      # If testing directly without a reverse proxy, change to "8000:8000"
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
